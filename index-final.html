<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050403">
  <meta name="description" content="Vidio Viral Terbaru - Saksikan video terpopuler terbaru.">
  <title>Vidio Viral Terbaru</title>

  <style>
    /* =========================
       RESET
    ========================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #050403;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* =========================
       HERO
       Ganti background.png dengan
       nama file gambar kamu.
    ========================== */
    .hero {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background-color: #050403;
      background-image: url("https://cdn.phototourl.com/free/2026-08-07-05855b0e-a85d-4fd3-b45a-c609c754f6cc.jpg");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }

    /* Lapisan gelap */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.03) 0%,
          rgba(0, 0, 0, 0.30) 45%,
          rgba(0, 0, 0, 0.78) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.10) 42%,
          rgba(0, 0, 0, 0.72) 100%
        );
    }

    /* =========================
       KELIP / PARTIKEL
    ========================== */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffd99a;
      box-shadow:
        0 0 7px #ffd99a,
        0 0 18px rgba(255, 164, 59, .8);
      opacity: .75;
      animation: twinkle 2.5s ease-in-out infinite alternate;
    }

    .p1 { left: 8%; top: 22%; animation-delay: .2s; }
    .p2 { left: 18%; top: 68%; animation-delay: 1s; }
    .p3 { left: 32%; top: 17%; animation-delay: .6s; }
    .p4 { left: 49%; top: 30%; animation-delay: 1.4s; }
    .p5 { left: 64%; top: 17%; animation-delay: .8s; }
    .p6 { left: 78%; top: 63%; animation-delay: .3s; }
    .p7 { left: 91%; top: 28%; animation-delay: 1.7s; }
    .p8 { left: 42%; top: 76%; animation-delay: .4s; }
    .p9 { left: 12%; top: 82%; animation-delay: 1.2s; }
    .p10 { left: 86%; top: 78%; animation-delay: .9s; }

    @keyframes twinkle {
      from {
        transform: scale(.5);
        opacity: .25;
      }
      to {
        transform: scale(1.4);
        opacity: 1;
      }
    }

    /* =========================
       KONTEN
    ========================== */
    .content {
      position: relative;
      z-index: 2;

      width: min(1100px, 92%);
      padding:
        clamp(24px, 5vh, 70px)
        0
        clamp(35px, 7vh, 80px);

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       ORNAMEN
    ========================== */
    .ornament {
      position: relative;
      width: min(500px, 72%);
      height: 2px;
      margin-bottom: clamp(14px, 2.5vh, 24px);

      background:
        linear-gradient(
          90deg,
          transparent,
          #d99a42 18%,
          #fff0c7 50%,
          #d99a42 82%,
          transparent
        );

      box-shadow:
        0 0 8px rgba(255, 180, 72, .8),
        0 0 20px rgba(255, 151, 35, .35);
    }

    .ornament::before,
    .ornament::after {
      content: "✦";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #ffe4aa;
      font-size: clamp(11px, 1.4vw, 17px);
      text-shadow: 0 0 12px #ffae42;
    }

    .ornament::before { left: 0; }
    .ornament::after { right: 0; }

    /* =========================
       JUDUL
    ========================== */
    h1 {
      max-width: 100%;

      font-size: clamp(48px, 9.3vw, 125px);
      line-height: .90;
      letter-spacing: clamp(.01em, .3vw, .035em);
      font-weight: 500;

      color: #fff5dc;

      text-shadow:
        0 0 4px #fff,
        0 0 14px rgba(255, 183, 83, .95),
        0 0 35px rgba(255, 126, 25, .55),
        3px 4px 0 rgba(62, 28, 5, .65);
    }

    /* =========================
       SUBTITLE
    ========================== */
    .subtitle {
      width: 100%;
      margin:
        clamp(17px, 3vh, 30px)
        auto
        clamp(25px, 4vh, 40px);

      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(7px, 2vw, 20px);

      color: #fff8e9;
      font-size: clamp(15px, 2.4vw, 29px);
      line-height: 1.35;
      letter-spacing: clamp(.02em, .25vw, .08em);

      text-shadow:
        0 2px 8px #000,
        0 0 8px rgba(0,0,0,.6);
    }

    .subtitle-line {
      flex: 0 1 clamp(25px, 8vw, 95px);
      height: 2px;
      background:
        linear-gradient(
          90deg,
          transparent,
          #ffc56c
        );
      box-shadow: 0 0 8px #ffb84d;
    }

    .subtitle-line:last-child {
      background:
        linear-gradient(
          90deg,
          #ffc56c,
          transparent
        );
    }

    .subtitle-text {
      flex: 0 1 auto;
    }

    /* =========================
       CTA
    ========================== */
    .cta {
      width: min(700px, 92vw);
      min-height: clamp(76px, 11vw, 130px);

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.2vw, 26px);

      padding:
        clamp(10px, 2vw, 22px)
        clamp(18px, 5vw, 55px);

      border:
        clamp(2px, .25vw, 3px)
        solid #ffd07b;

      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(65, 30, 8, .38),
          rgba(15, 7, 3, .58)
        );

      color: #fff;
      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(20px, 3.8vw, 44px);
      font-weight: 500;
      letter-spacing: .025em;

      box-shadow:
        0 0 7px rgba(255, 222, 155, .95),
        0 0 22px rgba(255, 159, 49, .72),
        inset 0 0 22px rgba(255, 153, 44, .15);

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease;
    }

    .cta:hover {
      transform: translateY(-4px) scale(1.012);

      background:
        linear-gradient(
          180deg,
          rgba(105, 45, 10, .50),
          rgba(30, 10, 3, .70)
        );

      box-shadow:
        0 0 12px rgba(255, 235, 175, 1),
        0 0 40px rgba(255, 159, 49, .9),
        inset 0 0 30px rgba(255, 153, 44, .25);
    }

    .cta:active {
      transform: scale(.985);
    }

    /* =========================
       ICON PLAY
    ========================== */
    .play {
      flex: 0 0 auto;

      width: clamp(48px, 6vw, 76px);
      aspect-ratio: 1;

      display: grid;
      place-items: center;

      border:
        clamp(2px, .25vw, 3px)
        solid #fff4d4;

      border-radius: 50%;

      background: rgba(255,255,255,.04);

      box-shadow:
        0 0 15px rgba(255,188,87,.9),
        inset 0 0 10px rgba(255,255,255,.08);
    }

    .play::after {
      content: "";
      width: 0;
      height: 0;
      margin-left: 5px;

      border-top: clamp(9px, 1.2vw, 16px) solid transparent;
      border-bottom: clamp(9px, 1.2vw, 16px) solid transparent;
      border-left: clamp(14px, 1.8vw, 24px) solid #fff;

      filter: drop-shadow(0 0 5px #fff);
    }

    /* =========================
       TEKS BAWAH
    ========================== */
    .bottom {
      margin-top: clamp(27px, 5vh, 52px);

      color: #fff8ea;
      font-size: clamp(14px, 2vw, 26px);
      line-height: 1.4;
      letter-spacing: clamp(.02em, .25vw, .07em);

      text-shadow: 0 2px 8px #000;
    }

    .arrow {
      display: block;

      width: clamp(18px, 2.5vw, 28px);
      aspect-ratio: 1;

      margin:
        clamp(13px, 2vh, 19px)
        auto
        0;

      border-right: clamp(2px, .2vw, 3px) solid #fff;
      border-bottom: clamp(2px, .2vw, 3px) solid #fff;

      transform: rotate(45deg);

      filter: drop-shadow(0 0 6px #ffbd61);

      animation: bounce 1.6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0) rotate(45deg);
      }

      50% {
        transform: translateY(8px) rotate(45deg);
      }
    }

    /* =========================
       TABLET
    ========================== */
    @media (max-width: 900px) {
      .hero {
        background-position: center center;
      }

      .content {
        width: min(94%, 760px);
      }

      h1 {
        font-size: clamp(50px, 11vw, 88px);
      }

      .cta {
        width: min(680px, 94vw);
      }
    }

    /* =========================
       HP
    ========================== */
    @media (max-width: 600px) {
      .hero {
        min-height: 100svh;
        background-position: center center;
      }

      .content {
        width: 94%;
        padding:
          30px
          0
          45px;
      }

      .ornament {
        width: 70%;
        margin-bottom: 15px;
      }

      h1 {
        font-size: clamp(43px, 13vw, 72px);
        line-height: .93;
      }

      .subtitle {
        font-size: clamp(14px, 4vw, 18px);
        gap: 7px;
        margin-top: 17px;
        margin-bottom: 27px;
      }

      .subtitle-line {
        flex-basis: clamp(20px, 7vw, 45px);
      }

      .cta {
        width: 94%;
        min-height: 72px;
        gap: 12px;
        padding: 10px 17px;
        font-size: clamp(18px, 5.2vw, 25px);
      }

      .bottom {
        margin-top: 28px;
        font-size: clamp(13px, 4vw, 17px);
      }
    }

    /* =========================
       HP KECIL
    ========================== */
    @media (max-width: 390px) {
      .content {
        width: 96%;
      }

      h1 {
        font-size: 12.8vw;
      }

      .subtitle {
        font-size: 14px;
        line-height: 1.35;
      }

      .subtitle-line {
        flex-basis: 18px;
      }

      .cta {
        width: 97%;
        min-height: 65px;
        padding: 9px 13px;
        gap: 9px;
        font-size: 18px;
      }

      .play {
        width: 44px;
      }

      .bottom {
        font-size: 13px;
      }
    }

    /* =========================
       LAYAR SANGAT TINGGI
    ========================== */
    @media (min-height: 850px) and (min-width: 601px) {
      .content {
        transform: translateY(-1vh);
      }
    }

    /* =========================
       LAYAR LANDSCAPE HP
    ========================== */
    @media (max-height: 600px) and (orientation: landscape) {
      .hero {
        min-height: 100svh;
      }

      .content {
        padding: 20px 0 30px;
      }

      .ornament {
        margin-bottom: 10px;
      }

      h1 {
        font-size: clamp(38px, 9vw, 70px);
      }

      .subtitle {
        margin: 12px auto 18px;
        font-size: clamp(13px, 2.7vw, 20px);
      }

      .cta {
        min-height: 60px;
        width: min(620px, 80vw);
      }

      .play {
        width: 42px;
      }

      .bottom {
        margin-top: 18px;
        font-size: 13px;
      }

      .arrow {
        margin-top: 9px;
      }
    }

    /* =========================
       PENGGUNA YANG MEMATIKAN ANIMASI
    ========================== */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .particle,
      .arrow {
        animation: none;
      }

      .cta {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- Partikel cahaya dekorasi -->
    <div class="particles" aria-hidden="true">
      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
      <span class="particle p5"></span>
      <span class="particle p6"></span>
      <span class="particle p7"></span>
      <span class="particle p8"></span>
      <span class="particle p9"></span>
      <span class="particle p10"></span>
    </div>

    <section class="content">

      <div class="ornament"></div>

      <h1>
        VIDIO VIRAL<br>
        TERBARU
      </h1>

      <div class="subtitle">
        <span class="subtitle-line"></span>

        <div class="subtitle-text">
          Vidio Hot Terbaru. Jangan sampai ketinggalan.
        </div>

        <span class="subtitle-line"></span>
      </div>

      <!--
        GANTI URL DI JAVASCRIPT DI BAGIAN BAWAH
        JIKA TOMBOL INGIN DIARAHKAN KE HALAMAN LAIN.
      -->
      <a
        class="cta"
        href="https://cdn.phototourl.com/free/2026-08-07-05855b0e-a85d-4fd3-b45a-c609c754f6cc.jpg"
        onclick="goToVideo(event)"
        aria-label="Tonton sekarang"
      >
        <span class="play" aria-hidden="true"></span>
        <span>TONTON SEKARANG</span>
      </a>

      <div class="bottom">
        Jelajahi Vidio Viral Terbaru
        <span class="arrow" aria-hidden="true"></span>
      </div>

    </section>
  </main>

  <script>
    function goToVideo(event) {
      event.preventDefault();

      /*
        ==============================
        MASUKKAN URL TUJUAN DI SINI
        ==============================

        Contoh:
        const urlTujuan = "https://contoh.com";

        Jika belum punya URL, biarkan "#".
      */

      const urlTujuan = "https://cdn.phototourl.com/free/2026-08-07-05855b0e-a85d-4fd3-b45a-c609c754f6cc.jpg";

      if (urlTujuan === "https://cdn.phototourl.com/free/2026-08-07-05855b0e-a85d-4fd3-b45a-c609c754f6cc.jpg") {
        alert("URL tujuan belum diatur.");
        return;
      }

      window.location.href = urlTujuan;
    }
  </script>

</body>
</html>
